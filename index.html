<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TODO Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    

    <!-- TODO Project-->
     <div class="container py-5 ">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-4 p-4 todo-card">
                    <h2 class="text-center mb-4 fw-bold todo-title">My Todo List</h2>
                    <div class="input-group mb-4">
                        <input type="text" class="form-control input-area focus-ring-success task-input" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
                        <button class="input-group-text bg-success btn-add" id="inputGroup-sizing-default">ADD</button>
                    </div>

                    <div class="filter-group d-flex gap-2">
                      <button class="filter-btn active" data-filter="all">All</button>
                      <button class="filter-btn" data-filter="active">Active</button>
                      <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    
                   <div class="task-list d-flex flex-column gap-3" id="taskList">             
                    </div>

                    <hr class="my-4">
                    <div class="d-flex justify-content-between align-items-center todo-footer">
                        
                          <p class="d-flex align-items-center mb-0">
                            <span id="activeCount">0</span> 
                            <span>active tasks</span>
                          </p>
                          <p class="d-flex align-items-center mb-0">
                            <span id="completedCount">0</span>
                            <span>Completed tasks</span>
                          </p>
                        <button class="btn btn-outline-danger btn-sm" id="clearAll">
                          Clear All
                        </button>
                    </div>
                </div>
            </div>
        </div>
     </div>

     <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
